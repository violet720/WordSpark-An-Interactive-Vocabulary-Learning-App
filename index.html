<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordSpark · Interactive Vocabulary Challenge</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');

:root{
  --bg-1:#eef1fa;
  --bg-2:#e2e7f6;
  --panel:#ffffff;
  --panel-line:#dbe0f0;
  --ink:#1c2340;
  --ink-dim:#727a9c;
  --cyan:#0e9a8c;
  --cyan-dim:#0e9a8c1f;
  --violet:#6c4fd6;
  --violet-dim:#6c4fd61f;
  --amber:#d98c00;
  --amber-dim:#d98c001f;
  --green:#1f9d5c;
  --green-dim:#1f9d5c1a;
  --red:#e0314f;
  --red-dim:#e0314f1a;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 20% 0%,#dce3f7 0%,var(--bg-1) 55%),
    var(--bg-1);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  color:var(--ink);
}

#stage{
  width:100%;
  max-width:1080px;
  position:relative;
}

#board{
  position:relative;
  background:
    linear-gradient(180deg,rgba(14,154,140,.03),transparent 40%),
    var(--panel);
  border:1px solid var(--panel-line);
  border-radius:16px;
  min-height:660px;
  padding:30px 34px;
  display:flex;
  flex-direction:column;
  box-shadow:0 20px 50px rgba(28,35,64,.1);
  overflow:hidden;
}

#board::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(28,35,64,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,35,64,.025) 1px,transparent 1px);
  background-size:34px 34px;
  pointer-events:none;
}

h1,h2,.display{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
}

.numeric{
  font-family:'Orbitron',sans-serif;
}

button{
  font-family:'Rajdhani',sans-serif;
  cursor:pointer;
  border:none;
  outline:none;
}

.btn{
  background:linear-gradient(135deg,var(--cyan),#2bc4b0);
  color:#06251f;
  font-weight:700;
  font-size:16px;
  padding:12px 24px;
  border-radius:8px;
  box-shadow:0 5px 0 #1d7f72;
  transition:.12s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #1d7f72;
}

.btn.secondary{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--panel-line);
  box-shadow:none;
}

.btn.secondary:hover{
  border-color:var(--cyan);
  color:var(--cyan);
}

.btn.success{
  background:linear-gradient(135deg,var(--green),#24a86a);
  box-shadow:0 5px 0 #1a7a4d;
}

.btn.danger{
  background:linear-gradient(135deg,var(--red),#d43a56);
  box-shadow:0 5px 0 #9c1f36;
}

.btn.small{
  font-size:13px;
  padding:8px 12px;
  box-shadow:none;
}

.btn:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}

input,
select{
  font-family:'Inter',sans-serif;
  background:rgba(28,35,64,.035);
  border:1.5px solid var(--panel-line);
  border-radius:8px;
  color:var(--ink);
  padding:10px 12px;
  font-size:14px;
  width:100%;
}

input:focus,
select:focus{
  border-color:var(--cyan);
  outline:none;
}

label{
  font-size:11.5px;
  color:var(--ink-dim);
  display:block;
  margin-bottom:6px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.07em;
}

.eyebrow{
  font-size:12px;
  color:var(--cyan);
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:6px;
}

.sub,
.hint{
  font-size:12.5px;
  color:var(--ink-dim);
  line-height:1.6;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  flex-wrap:wrap;
  position:relative;
  z-index:1;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tabbar{
  display:flex;
  gap:8px;
  margin:20px 0 18px;
  position:relative;
  z-index:1;
  flex-wrap:wrap;
}

.tab{
  padding:8px 14px;
  border-radius:999px;
  background:rgba(28,35,64,.04);
  border:1px solid var(--panel-line);
  color:var(--ink-dim);
  font-weight:700;
}

.tab.active{
  background:var(--cyan-dim);
  border-color:var(--cyan);
  color:var(--cyan);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:22px;
  position:relative;
  z-index:1;
  flex:1;
}

@media(max-width:820px){
  .grid{
    grid-template-columns:1fr;
  }
}

.panel{
  background:rgba(28,35,64,.025);
  border:1px solid var(--panel-line);
  border-radius:12px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.panel h2{
  font-size:16px;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:620px){
  .row2{
    grid-template-columns:1fr;
  }
}

.bank-list{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:350px;
  overflow:auto;
  padding-right:4px;
}

.word-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:9px 11px;
  border:1px solid var(--panel-line);
  border-left:3px solid var(--cyan);
  border-radius:8px;
  background:rgba(28,35,64,.025);
  font-size:13px;
}

.word-row.hard{
  border-left-color:var(--violet);
}

.word-row.boss{
  border-left-color:var(--amber);
}

.word-en{
  font-family:'JetBrains Mono';
  font-size:11px;
  color:var(--ink-dim);
  margin-left:8px;
}

.tag{
  font-size:10px;
  font-weight:700;
  border-radius:999px;
  padding:2px 7px;
  margin-right:6px;
}

.tag.normal{
  background:var(--cyan-dim);
  color:var(--cyan);
}

.tag.hard{
  background:var(--violet-dim);
  color:var(--violet);
}

.tag.boss{
  background:var(--amber-dim);
  color:var(--amber);
}

.mini-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  background:none;
  color:var(--ink-dim);
  font-size:15px;
  padding:2px 5px;
}

.icon-btn:hover{
  color:var(--red);
}

.saved-set{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border:1px solid var(--panel-line);
  border-radius:9px;
  background:#fff;
}

.saved-set small{
  color:var(--ink-dim);
}

.callout{
  padding:12px 14px;
  border:1px dashed var(--cyan);
  background:var(--cyan-dim);
  border-radius:10px;
  font-size:12.5px;
  line-height:1.55;
}

.setup-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
  position:relative;
  z-index:1;
}

.hud{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  position:relative;
  z-index:1;
}

.hearts{
  display:flex;
  gap:5px;
  font-size:19px;
}

.heart.lost{
  opacity:.18;
}

.hud-stat{
  text-align:center;
}

.hud-stat .label{
  font-size:10px;
  color:var(--ink-dim);
  font-weight:700;
  text-transform:uppercase;
}

.hud-stat .val{
  font-size:20px;
  font-weight:700;
}

.combo{
  color:var(--amber);
}

.xp-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.xp-lv{
  font-size:12px;
  font-weight:700;
  color:var(--cyan);
  background:var(--cyan-dim);
  padding:3px 9px;
  border-radius:20px;
}

.xp-track{
  width:100px;
  height:6px;
  background:rgba(28,35,64,.1);
  border-radius:4px;
  overflow:hidden;
}

.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
}

.map-row{
  display:flex;
  align-items:center;
  gap:0;
  margin:20px 0 10px;
  overflow:auto;
  padding:6px 2px 14px;
  position:relative;
  z-index:1;
}

.map-node{
  width:30px;
  height:30px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  font-family:'JetBrains Mono';
  border:2px solid var(--panel-line);
  color:var(--ink-dim);
  background:var(--bg-2);
}

.map-node.boss{
  width:36px;
  height:36px;
  border-radius:9px;
  transform:rotate(45deg);
}

.map-node.boss span{
  transform:rotate(-45deg);
}

.map-node.current{
  border-color:var(--cyan);
  color:var(--cyan);
  box-shadow:0 0 0 4px var(--cyan-dim);
}

.map-node.correct{
  border-color:var(--green);
  background:var(--green-dim);
  color:var(--green);
}

.map-node.wrong{
  border-color:var(--red);
  background:var(--red-dim);
  color:var(--red);
}

.map-line{
  width:20px;
  height:2px;
  background:var(--panel-line);
  flex-shrink:0;
}

.card-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.challenge-tag{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:5px 14px;
  border-radius:20px;
  margin-bottom:18px;
}

.challenge-tag.normal{
  background:var(--cyan-dim);
  color:var(--cyan);
}

.challenge-tag.hard{
  background:var(--violet-dim);
  color:var(--violet);
}

.challenge-tag.boss{
  background:var(--amber-dim);
  color:var(--amber);
}

.prompt-text{
  font-family:'Rajdhani';
  font-size:clamp(30px,4.6vw,50px);
  font-weight:700;
  text-align:center;
  margin-bottom:6px;
}

.tiles-wrap{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:18px 0 28px;
}

.tile{
  width:48px;
  height:58px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'JetBrains Mono';
  font-size:22px;
  font-weight:700;
  border:2px solid var(--panel-line);
  background:rgba(28,35,64,.025);
  color:transparent;
  position:relative;
}

.tile.revealed{
  color:var(--green);
  border-color:var(--green);
  background:var(--green-dim);
}

.tile-icon{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:var(--ink-dim);
  opacity:.5;
}

.timer{
  font-family:'Orbitron';
  font-size:24px;
  font-weight:700;
  color:var(--cyan);
}

.timer.danger{
  color:var(--red);
}

.play-controls{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  position:relative;
  z-index:1;
}

.end-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  position:relative;
  z-index:1;
}

.rank{
  font-family:'Orbitron';
  font-size:42px;
  font-weight:800;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  width:100%;
  max-width:460px;
}

.stat{
  background:rgba(28,35,64,.03);
  border:1px solid var(--panel-line);
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat .label{
  font-size:10px;
  color:var(--ink-dim);
  text-transform:uppercase;
}

.stat .val{
  font-family:'Orbitron';
  font-size:20px;
  font-weight:700;
}

.review{
  width:100%;
  max-width:520px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:220px;
  overflow:auto;
}

.review-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 12px;
  border-radius:8px;
  background:rgba(28,35,64,.025);
  font-size:13px;
  border-left:3px solid var(--panel-line);
}

.review-row.hit{
  border-left-color:var(--green);
}

.review-row.miss{
  border-left-color:var(--red);
}

.projection-note{
  font-size:11px;
  color:var(--ink-dim);
}

.teacher-badge{
  font-size:11px;
  background:var(--violet-dim);
  color:var(--violet);
  padding:5px 10px;
  border-radius:999px;
  font-weight:700;
}

.empty{
  padding:18px 4px;
  color:var(--ink-dim);
  font-size:13px;
  font-style:italic;
}
</style>
</head>

<body>

<div id="stage">
  <div id="board"></div>
</div>

<script>

const STORAGE_KEY='violet_vocab_sets_v2';
const CHANNEL='violet_vocab_projection_v2';

let bc=null;

try{
  bc=new BroadcastChannel(CHANNEL);
}catch(e){}

let state={
  screen:'setup',
  tab:'bank',

  title:'Vocabulary Quest：迷霧試煉',

  timePerWord:25,

  words:[],

  selectedCount:12,

  shuffle:true,

  sessionWords:[],

  current:0,

  timeLeft:0,

  timerId:null,

  revealed:false,

  hearts:3,

  combo:0,

  maxCombo:0,

  xp:0,

  results:[],

  savedSets:loadSets(),

  isProjection:false
};

function loadSets(){

  try{
    return JSON.parse(
      localStorage.getItem(STORAGE_KEY)||'[]'
    );
  }
  catch(e){
    return [];
  }

}

function saveSets(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state.savedSets)
  );

}

function levelFromXp(xp){

  return Math.floor(xp/100)+1;

}

function escapeHtml(v){

  return String(v).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}

function shuffled(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function loadSample(){

  state.title='Unit 4 Vocabulary';

  state.words=[

    {
      hint:'蘋果',
      word:'apple',
      level:'normal'
    },

    {
      hint:'圖書館',
      word:'library',
      level:'normal'
    },

    {
      hint:'環境',
      word:'environment',
      level:'hard'
    },

    {
      hint:'旅行',
      word:'travel',
      level:'normal'
    },

    {
      hint:'機會',
      word:'opportunity',
      level:'hard'
    },

    {
      hint:'不可思議的',
      word:'incredible',
      level:'boss'
    },

    {
      hint:'文化',
      word:'culture',
      level:'normal'
    },

    {
      hint:'選擇',
      word:'choice',
      level:'normal'
    },

    {
      hint:'經驗',
      word:'experience',
      level:'hard'
    },

    {
      hint:'成功',
      word:'success',
      level:'normal'
    },

    {
      hint:'挑戰',
      word:'challenge',
      level:'hard'
    },

    {
      hint:'負責任的',
      word:'responsible',
      level:'boss'
    },

    {
      hint:'改善',
      word:'improve',
      level:'normal'
    },

    {
      hint:'決定',
      word:'decision',
      level:'hard'
    },

    {
      hint:'溝通',
      word:'communication',
      level:'boss'
    }

  ];

  state.selectedCount=Math.min(
    12,
    state.words.length
  );

  render();

}

function addWord(){

  const hint=
    document
    .getElementById('hintInput')
    .value
    .trim();

  const word=
    document
    .getElementById('wordInput')
    .value
    .trim()
    .toLowerCase();

  const level=
    document
    .getElementById('levelSelect')
    .value;

  if(!hint||!word){

    alert('請輸入中文提示與英文單字');

    return;

  }

  state.words.push({
    hint,
    word,
    level
  });

  state.selectedCount=
    Math.min(
      Math.max(
        state.selectedCount,
        1
      ),
      state.words.length
    );

  render();

}

function removeWord(i){

  state.words.splice(i,1);

  state.selectedCount=
    Math.min(
      state.selectedCount,
      state.words.length||1
    );

  render();

}

function clearWords(){

  if(
    confirm('確定清空目前題庫？')
  ){

    state.words=[];

    render();

  }

}

function saveCurrentSet(){

  if(!state.words.length){

    alert('題庫目前是空的');

    return;

  }

  const name=
    (state.title||'未命名題庫')
    .trim();

  const existing=
    state.savedSets.findIndex(
      s=>s.name===name
    );

  const payload={

    id:
      existing>=0
      ?state.savedSets[existing].id
      :Date.now(),

    name,

    words:state.words,

    timePerWord:state.timePerWord,

    updatedAt:new Date().toISOString()

  };

  if(existing>=0){

    state.savedSets[existing]=payload;

  }
  else{

    state.savedSets.unshift(payload);

  }

  saveSets();

  render();

  alert('已儲存題庫：'+name);

}

function loadSet(id){

  const s=
    state.savedSets.find(
      x=>x.id===id
    );

  if(!s)return;

  state.title=s.name;

  state.words=
    JSON.parse(
      JSON.stringify(s.words)
    );

  state.timePerWord=
    s.timePerWord||25;

  state.selectedCount=
    Math.min(
      12,
      state.words.length
    );

  state.tab='bank';

  render();

}

function deleteSet(id){

  if(
    !confirm('確定刪除此題庫？')
  )return;

  state.savedSets=
    state.savedSets.filter(
      x=>x.id!==id
    );

  saveSets();

  render();

}

function startGame(){

  if(!state.words.length){

    alert('請先建立或載入題庫');

    return;

  }

  const count=
    Math.max(
      1,
      Math.min(
        parseInt(state.selectedCount)
        ||state.words.length,
        state.words.length
      )
    );

  state.sessionWords=
    (
      state.shuffle
      ?shuffled(state.words)
      :[...state.words]
    ).slice(0,count);

  state.current=0;

  state.hearts=3;

  state.combo=0;

  state.maxCombo=0;

  state.xp=0;

  state.results=[];

  state.screen='play';

  beginWord();

}

function beginWord(){

  clearInterval(
    state.timerId
  );

  state.timeLeft=
    state.timePerWord;

  state.revealed=false;

  state.timerId=
    setInterval(()=>{

      state.timeLeft--;

      if(
        state.timeLeft<=0
      ){

        revealAnswer();

      }
      else{

        render();

        broadcast();

      }

    },1000);

  render();

  broadcast();

}

function revealAnswer(){

  clearInterval(
    state.timerId
  );

  state.revealed=true;

  render();

  broadcast();

}

function markResult(correct){

  const w=
    state.sessionWords[
      state.current
    ];

  let gained=0;

  if(correct){

    state.combo++;

    state.maxCombo=
      Math.max(
        state.maxCombo,
        state.combo
      );

    const mult=
      1+
      Math.floor(
        state.combo/3
      )*.5;

    const base=
      w.level==='boss'
      ?40
      :(
        w.level==='hard'
        ?20
        :10
      );

    gained=
      Math.round(
        base*mult
      );

    state.xp+=gained;

  }
  else{

    state.combo=0;

    state.hearts=
      Math.max(
        0,
        state.hearts-1
      );

  }

  state.results.push({

    hint:w.hint,

    word:w.word,

    correct,

    level:w.level,

    gained

  });

  setTimeout(
    nextWord,
    300
  );

}

function nextWord(){

  if(
    state.current>=
    state.sessionWords.length-1
  ){

    clearInterval(
      state.timerId
    );

    state.screen='end';

    render();

    broadcast();

  }
  else{

    state.current++;

    beginWord();

  }

}

function retryWrong(){

  const wrong=
    state.results
    .filter(
      r=>!r.correct
    )
    .map(
      r=>({
        hint:r.hint,
        word:r.word,
        level:r.level
      })
    );

  if(!wrong.length){

    alert('這次沒有錯題！');

    return;

  }

  state.sessionWords=wrong;

  state.current=0;

  state.hearts=3;

  state.combo=0;

  state.maxCombo=0;

  state.xp=0;

  state.results=[];

  state.screen='play';

  beginWord();

}

function backToSetup(){

  clearInterval(
    state.timerId
  );

  state.screen='setup';

  render();

  broadcast();

}

function broadcast(){

  if(!bc)return;

  bc.postMessage({

    screen:state.screen,

    title:state.title,

    timePerWord:
      state.timePerWord,

    sessionWords:
      state.sessionWords,

    current:
      state.current,

    timeLeft:
      state.timeLeft,

    revealed:
      state.revealed,

    hearts:
      state.hearts,

    combo:
      state.combo,

    maxCombo:
      state.maxCombo,

    xp:
      state.xp,

    results:
      state.results

  });

}

function openProjection(){

  const w=
    window.open(
      location.href+'#projection',
      'VioletProjection',
      'width=1200,height=800'
    );

  if(!w){

    alert(
      '瀏覽器阻擋了投影視窗，請允許彈出視窗。'
    );

  }

  setTimeout(
    broadcast,
    700
  );

}

if(
  location.hash==='#projection'
){

  state.isProjection=true;

  if(bc){

    bc.onmessage=e=>{

      Object.assign(
        state,
        e.data
      );

      render();

    };

  }

  document.title=
    '詞彙異境 · 投影模式';

}

function render(){

  const board=
    document
    .getElementById('board');

  if(
    state.isProjection
  ){

    board.innerHTML=
      state.screen==='play'
      ?renderPlay(true)
      :state.screen==='end'
      ?renderEnd(true)
      :renderProjectionWaiting();

    return;

  }

  board.innerHTML=
    state.screen==='setup'
    ?renderSetup()
    :state.screen==='play'
    ?renderPlay(false)
    :renderEnd(false);

}

function renderProjectionWaiting(){

  return `
    <div class="end-wrap">

      <div class="eyebrow">
        Student Projection
      </div>

      <h1>
        詞彙異境
      </h1>

      <div class="sub">
        等待老師開始任務…
      </div>

    </div>
  `;

}

function renderSetup(){

  const wordRows=
    state.words
    .map(
      (w,i)=>`

      <div class="word-row ${w.level}">

        <div>

          <span class="tag ${w.level}">

            ${
              w.level==='boss'
              ?'首領'
              :w.level==='hard'
              ?'困難'
              :'普通'
            }

          </span>

          ${escapeHtml(w.hint)}

          <span class="word-en">

            ${escapeHtml(w.word)}

          </span>

        </div>

        <div class="mini-actions">

          <button
            class="icon-btn"
            onclick="removeWord(${i})"
          >
            ✕
          </button>

        </div>

      </div>

    `
    )
    .join('')
    ||
    `
    <div class="empty">

      尚未建立題目。
      可以先載入 15 題範例，
      再修改成你的教材。

    </div>
    `;

  const sets=
    state.savedSets
    .map(
      s=>`

      <div class="saved-set">

        <div>

          <strong>
            ${escapeHtml(s.name)}
          </strong>

          <br>

          <small>
            ${s.words.length} 題
          </small>

        </div>

        <div class="mini-actions">

          <button
            class="btn small secondary"
            onclick="loadSet(${s.id})"
          >
            載入
          </button>

          <button
            class="icon-btn"
            onclick="deleteSet(${s.id})"
          >
            ✕
          </button>

        </div>

      </div>

    `
    )
    .join('')
    ||
    `
    <div class="empty">

      還沒有已儲存題庫。

    </div>
    `;

  return `

  <div class="topbar">

    <div>

      <div class="eyebrow">
        Teacher Console
      </div>

      <h1>
        ${escapeHtml(state.title)}
      </h1>

      <div class="sub">
        老師端管理題庫；
        學生投影端不會看到答案。
      </div>

    </div>

    <div class="top-actions">

      <span class="teacher-badge">
        教師模式
      </span>

      <button
        class="btn small secondary"
        onclick="loadSample()"
      >
        載入 15 題範例
      </button>

      <button
        class="btn small secondary"
        onclick="openProjection()"
      >
        開啟學生投影視窗
      </button>

    </div>

  </div>


  <div class="tabbar">

    <button
      class="tab ${state.tab==='bank'?'active':''}"
      onclick="
        state.tab='bank';
        render();
      "
    >
      題庫編輯
    </button>

    <button
      class="tab ${state.tab==='saved'?'active':''}"
      onclick="
        state.tab='saved';
        render();
      "
    >
      已儲存題庫
    </button>

    <button
      class="tab ${state.tab==='session'?'active':''}"
      onclick="
        state.tab='session';
        render();
      "
    >
      測驗設定
    </button>

  </div>


  ${
    state.tab==='bank'
    ?`

    <div class="grid">

      <div class="panel">

        <h2>
          🗝 建立題目
        </h2>

        <div>

          <label>
            題庫名稱
          </label>

          <input
            value="${escapeHtml(state.title)}"
            oninput="
              state.title=this.value
            "
          >

        </div>

        <div>

          <label>
            中文提示
          </label>

          <input
            id="hintInput"
            placeholder="例如：不可思議的"
          >

        </div>

        <div class="row2">

          <div>

            <label>
              英文單字
            </label>

            <input
              id="wordInput"
              placeholder="例如：incredible"
              onkeydown="
                if(event.key==='Enter')
                  addWord()
              "
            >

          </div>

          <div>

            <label>
              難度
            </label>

            <select id="levelSelect">

              <option value="normal">
                普通
              </option>

              <option value="hard">
                困難
              </option>

              <option value="boss">
                首領
              </option>

            </select>

          </div>

        </div>

        <button
          class="btn secondary"
          onclick="addWord()"
        >
          ＋ 加入題庫
        </button>

        <button
          class="btn secondary"
          onclick="saveCurrentSet()"
        >
          💾 儲存題庫
        </button>

        <div class="callout">

          題庫可以先在課前建立並儲存。

          上課時只需要載入題庫，
          不必再把英文答案輸入在學生面前。

        </div>

      </div>


      <div class="panel">

        <h2>

          📚 題庫

          <span class="tag normal">

            ${state.words.length} 題

          </span>

        </h2>

        <div class="bank-list">

          ${wordRows}

        </div>

        <button
          class="btn small secondary"
          onclick="clearWords()"
        >
          清空目前題庫
        </button>

      </div>

    </div>

    `
    :
    state.tab==='saved'
    ?`

    <div class="grid">

      <div class="panel">

        <h2>
          💾 已儲存題庫
        </h2>

        <div class="bank-list">

          ${sets}

        </div>

      </div>

      <div class="panel">

        <h2>
          使用方式
        </h2>

        <div class="callout">

          每個單元都可以存成獨立題庫。

          例如：

          Unit 3、
          Unit 4、
          期中複習。

          下次直接載入即可，
          不需要重新輸入。

        </div>

      </div>

    </div>

    `
    :`

    <div class="grid">

      <div class="panel">

        <h2>
          ⚙ 測驗設定
        </h2>

        <div>

          <label>
            每題倒數時間（秒）
          </label>

          <input
            type="number"
            min="5"
            max="180"
            value="${state.timePerWord}"
            oninput="
              state.timePerWord=
              parseInt(this.value)||25
            "
          >

        </div>

        <div>

          <label>
            本次抽幾題
          </label>

          <input
            type="number"
            min="1"
            max="${Math.max(1,state.words.length)}"
            value="${Math.min(state.selectedCount,Math.max(1,state.words.length))}"
            oninput="
              state.selectedCount=
              parseInt(this.value)||1
            "
          >

        </div>

        <div>

          <label>
            出題順序
          </label>

          <select
            onchange="
              state.shuffle=
              this.value==='random'
            "
          >

            <option
              value="random"
              ${state.shuffle?'selected':''}
            >
              隨機抽題
            </option>

            <option
              value="fixed"
              ${!state.shuffle?'selected':''}
            >
              照題庫順序
            </option>

          </select>

        </div>

        <button
          class="btn"
          onclick="startGame()"
          ${!state.words.length?'disabled':''}
        >
          ⚔ 開始闖關
        </button>

      </div>


      <div class="panel">

        <h2>
          🖥 教室使用流程
        </h2>

        <div class="callout">

          1. 課前建立並儲存題庫。
          <br>

          2. 上課載入題庫，
          設定抽題數。
          <br>

          3. 開啟學生投影視窗。
          <br>

          4. 老師保留控制畫面，
          學生只看到題目。
          <br>

          5. 測驗結束後，
          可以直接進行錯題再挑戰。

        </div>

        <div class="projection-note">

          如果使用延伸桌面，
          可以把學生視窗放到投影機，
          老師端則留在自己的電腦。

        </div>

      </div>

    </div>

    `
  }


  <div class="setup-footer">

    <span class="hint">

      題庫不限 6 題，
      可以自行建立大量單字，
      再決定每次抽幾題。

    </span>

    <button
      class="btn secondary"
      onclick="
        state.tab='session';
        render();
      "
    >
      下一步：測驗設定 →
    </button>

  </div>

  `;

}

function renderPlay(projection){

  const w=
    state.sessionWords[
      state.current
    ];

  if(!w){

    return renderProjectionWaiting();

  }

  const total=
    state.sessionWords.length;

  const level=
    levelFromXp(
      state.xp
    );

  const xpInLevel=
    state.xp%100;

  const hearts=
    [0,1,2]
    .map(
      i=>`
      <span class="heart ${i>=state.hearts?'lost':''}">
        ❤️
      </span>
      `
    )
    .join('');

  const map=
    state.sessionWords
    .map(
      (word,idx)=>{

        let cls=
          'map-node'
          +(word.level==='boss'
          ?' boss'
          :'');

        let content=
          idx+1;

        if(
          idx<state.current
        ){

          const r=
            state.results[idx];

          cls+=
            r&&r.correct
            ?' correct'
            :' wrong';

          content=
            r&&r.correct
            ?'✓'
            :'✕';

        }
        else if(
          idx===state.current
        ){

          cls+=' current';

        }

        return `

          <div class="${cls}">

            ${
              word.level==='boss'
              ?`<span>${content}</span>`
              :content
            }

          </div>

          ${
            idx<total-1
            ?'<div class="map-line"></div>'
            :''
          }

        `;

      }
    )
    .join('');

  const tiles=
    w.word
    .split('')
    .map(
      ch=>
        ch===' '
        ?'<div style="width:16px"></div>'
        :`

        <div class="tile ${state.revealed?'revealed':''}">

          ${
            state.revealed
            ?escapeHtml(
              ch.toUpperCase()
            )
            :'<span class="tile-icon">🔒</span>'
          }

        </div>

        `
    )
    .join('');

  const tag=
    w.level==='boss'
    ?'⚠ 首領降臨'
    :w.level==='hard'
    ?'強化挑戰'
    :'一般挑戰';

  return `

    <div class="hud">

      <div class="hearts">

        ${hearts}

      </div>

      <div class="hud-stat">

        <div class="label">
          關卡
        </div>

        <div class="val numeric">

          ${state.current+1}
          /
          ${total}

        </div>

      </div>

      <div class="hud-stat">

        <div class="label">
          連擊
        </div>

        <div class="val combo numeric">

          ${
            state.combo
            ?'x'+state.combo
            :'-'
          }

        </div>

      </div>

      <div class="xp-wrap">

        <span class="xp-lv">

          LV.${level}

        </span>

        <div class="xp-track">

          <div
            class="xp-fill"
            style="width:${xpInLevel}%"
          >
          </div>

        </div>

      </div>

      <div class="timer ${state.timeLeft<=5?'danger':''}">

        ${state.timeLeft}s

      </div>

    </div>


    <div class="map-row">

      ${map}

    </div>


    <div class="card-wrap">

      <div class="challenge-tag ${w.level}">

        ${tag}

      </div>

      <div class="prompt-text">

        ${escapeHtml(w.hint)}

      </div>

      <div class="hint">

        ${w.word.replace(/ /g,'').length}
        個字母

        ·

        解開封印字母

      </div>

      <div class="tiles-wrap">

        ${tiles}

      </div>

    </div>


    ${
      projection
      ?''
      :`

      <div class="play-controls">

        ${
          !state.revealed

          ?`

          <button
            class="btn"
            onclick="revealAnswer()"
          >

            🗝 解開封印

          </button>

          `

          :`

          <button
            class="btn success"
            onclick="markResult(true)"
          >

            ✓ 過關成功

          </button>

          <button
            class="btn danger"
            onclick="markResult(false)"
          >

            ✕ 挑戰失敗

          </button>

          `
        }

        <button
          class="btn secondary"
          onclick="backToSetup()"
        >

          返回教師端

        </button>

      </div>

      `
    }

  `;

}

function renderEnd(projection){

  const total=
    state.results.length;

  const correct=
    state.results.filter(
      r=>r.correct
    ).length;

  const accuracy=
    total
    ?correct/total
    :0;

  const comboScore=
    total
    ?Math.min(
      state.maxCombo/total,
      1
    )
    :0;

  const composite=
    accuracy*70
    +
    comboScore*30;

  let rank='C';

  let title=
    '初心挑戰者';

  if(
    composite>=90
  ){

    rank='S';

    title=
      '傳說拼字大師';

  }
  else if(
    composite>=75
  ){

    rank='A';

    title=
      '詞彙獵人';

  }
  else if(
    composite>=55
  ){

    rank='B';

    title=
      '見習冒險者';

  }

  const review=
    state.results
    .map(
      r=>`

      <div class="review-row ${r.correct?'hit':'miss'}">

        <span>

          ${escapeHtml(r.hint)}

          <span class="word-en">

            ${escapeHtml(r.word)}

          </span>

        </span>

        <span>

          ${
            r.correct
            ?'✓ +'+r.gained+' XP'
            :'✕'
          }

        </span>

      </div>

      `
    )
    .join('');

  const wrong=
    state.results.filter(
      r=>!r.correct
    ).length;

  return `

    <div class="end-wrap">

      <div style="font-size:60px">
        🎁
      </div>

      <div>

        <div class="rank">

          RANK ${rank}

        </div>

        <div
          class="sub"
          style="text-align:center"
        >

          ${title}

        </div>

      </div>

      <div class="stats">

        <div class="stat">

          <div class="label">
            正確率
          </div>

          <div class="val">

            ${
              Math.round(
                accuracy*100
              )
            }%

          </div>

        </div>

        <div class="stat">

          <div class="label">
            最高連擊
          </div>

          <div class="val">

            x${state.maxCombo}

          </div>

        </div>

        <div class="stat">

          <div class="label">
            錯題
          </div>

          <div class="val">

            ${wrong}

          </div>

        </div>

      </div>

      <div class="review">

        ${review}

      </div>

      ${
        projection
        ?''
        :`

        <div class="play-controls">

          ${
            wrong

            ?`

            <button
              class="btn"
              onclick="retryWrong()"
            >

              ↻ 錯題再挑戰

            </button>

            `

            :''
          }

          <button
            class="btn secondary"
            onclick="backToSetup()"
          >

            返回教師端

          </button>

        </div>

        `
      }

    </div>

  `;

}

render();

</script>

</body>
</html>
